spring:
  config:
    import: optional:classpath:application-secret.yaml
  application:
    name: clothingstore
  datasource:
    url: jdbc:mysql://localhost:3306/clothingstore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root          # <--- Sửa user
    password: Tuan171204@     # <--- Sửa pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true    # Format SQL cho   đẹp
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200
  # Cấu hình RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Cấu hình Mail
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.example.clothingstore: DEBUG #
    org.springframework.web: ERROR

api:
  prefix: /api/v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha


# Cấu hình VNPay
payment:
  vnpay:
    url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    return-url: "http://localhost:3000/payment-result" # Frontend nhận kết quả ở đây

shipping:
  ghn:
    fee-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee" # URL tính phí
    address-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data"