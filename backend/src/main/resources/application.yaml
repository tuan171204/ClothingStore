server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: clothingstore
  
  main: 
    lazy-initialization: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Database
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clothingstore_db}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Tuan171204@}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate # Chuyển thành 'validate' khi deploy thật
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect # Cập nhật cho Spring Boot 3.x

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      key-prefix: "v2_"
      use-key-prefix: true

  # AI & Vector Store
  ai:
    google:
      genai:
        api-key: ${AI_GOOGLE_API_KEY}
        embedding:
          api-key: ${AI_GOOGLE_API_KEY}
          text:
            options:
              model: "gemini-embedding-001"
              dimensions: 768
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.1
      embedding:
        enabled: false
    vectorstore:
      pinecone:
        api-key: ${PINECONE_API_KEY}
        index-name: ${PINECONE_INDEX}
        project-id: ${PINECONE_PROJECT}

  # Message Queue
  rabbitmq:
    addresses: ${RABBITMQ_URL}

  # Mail (Mailtrap)
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

api:
  prefix: /api/v1

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600
  refreshable-duration: 36000

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_KEY}
  api-secret: ${CLOUDINARY_SECRET}

bonsai:
  opensearch:
    url: ${BONSAI_OPENSEARCH_URL}
    username: ${OPENSEARCH_USERNAME}
    password: ${OPENSEARCH_PASSWORD}

payment:
  vnpay:
    tmn-code: ${VNP_TMN_CODE}
    secret-key: ${VNP_HASH_SECRET}
    url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    return-url: ${VNP_RETURN_URL}

shipping:
  ghn:
    shop-id: ${GHN_SHOP_ID}
    api-key: ${GHN_API_KEY}
    shop-district-id: 1447
    fee-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee"
    address-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data"

logging:
  level:
    root: INFO
    com.example.clothingstore: DEBUG
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: ERROR