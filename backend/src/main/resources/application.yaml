spring:
  config:
    import: optional:classpath:application-secret.yaml
  application:
    name: clothingstore
  datasource:
    url: jdbc:mysql://localhost:3306/clothingstore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root          # <--- Sửa user
    password: Tuan171204@     # <--- Sửa pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # Tự động sinh/sửa bảng khi chạy code
    show-sql: false          # Hiện câu SQL ra log để debug cho dễ
    properties:
      hibernate:
        format_sql: true    # Format SQL cho đẹp
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200
  # Cấu hình RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Cấu hình Mail
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

api:
  prefix: /api/v1


# Cấu hình VNPay
payment:
  vnpay:
    url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    return-url: "http://localhost:3000/payment-result" # Frontend nhận kết quả ở đây

shipping:
  ghn:
    fee-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee" # URL tính phí
    address-url: "https://dev-online-gateway.ghn.vn/shiip/public-api/master-data"